      body_template: |
        Dear {school},

        Greetings from the ANVESHA Organizing Team.

        We are writing to extend our sincere gratitude to your institution for your valuable support and enthusiastic participation in ANVESHA '26, held at CHRIST (Deemed to be University), Kengeri Campus on 22nd – 23rd July 2026. Your school's wholehearted involvement, energy, and contribution played a vital role in making this fest a memorable success.

        As a token of our deep appreciation, please find attached your institution's Certificate of Appreciation to commend your outstanding dedication and support.

        Thank you once again for being an integral part of ANVESHA '26. We look forward to a continued relationship and to welcoming your institution back to our campus for future editions of the fest.

        With warm thanks and gratitude,
        The ANVESHA '26 Organizing Team
