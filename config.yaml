        Dear {volunteer_name},

        Greetings from the ANVESHA Organizing Team.

        We are writing to express our heartfelt gratitude to you for your hard work and commitment as a volunteer for ANVESHA '26, held on 22nd and 23rd July 2026 at CHRIST (Deemed to be University), Kengeri Campus. You were an integral member of the organizing team, and your contribution behind the scenes was absolutely essential to the smooth execution and overall success of the fest.

        To acknowledge your tireless efforts and dedication, please find your Certificate of Appreciation attached directly to this email.

        Thank you once again for your vital support, responsibility, and enthusiasm. We wish you the very best in all your future endeavors.

        With warm thanks and gratitude,
        The ANVESHA '26 Organizing Team
