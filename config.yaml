    email:
      subject_template: "Certificate of Recognition - ANVESHA '26 Winners - {school}"
      body_template: |
        Dear {poc_name},

        Greetings from the ANVESHA Organizing Team.

        We are writing to extend our heartiest congratulations to your student contingent for their outstanding performance at ANVESHA '26, held at CHRIST (Deemed to be University), Kengeri Campus. The dedication, talent, and excellence displayed by your students earned them well-deserved laurels and significantly raised the competitive spirit of the fest.

        To celebrate their achievement, please find their certificates of recognition (for 1st, 2nd, and 3rd prize winners) neatly structured by event in the Google Drive directory linked below. We have also attached an Excel sheet containing the reference names, events, and positions secured.

        {student_list}

        Kindly review the shared details and let us know if any student or certificate has been left out or requires any correction. We request you to distribute these certificates to the respective winners at your earliest convenience.

        Thank you once again for your cooperation and vital support. We look forward to welcoming your institution back to our campus for future editions of the fest.

        With warm thanks and gratitude,
        The ANVESHA '26 Organizing Team
